<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ATS Match</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Smart Career Assistant
    </div>

    <div class="nav-links">

        <a href="/">
            Resume Analyzer
        </a>

        <a href="/ats.html">
            ATS Match
        </a>

        <a href="/interview.html">
            Interview Prep
        </a>

        <a href="/history.html">
            History
        </a>

        <a href="/login.html">
            Login
        </a>

        <a href="/register.html">
            Register
        </a>

    </div>

</nav>

<div class="container">

    <h1>ATS Job Matching</h1>

    <p class="subtitle">

        Upload your resume and compare it
        against a Job Description.

    </p>

    <div class="upload-box">

        <input type="file"
               id="resumeFile"
               accept=".pdf">

    </div>

    <div class="section">

        <h2>Job Description</h2>

        <textarea

                id="jobDescription"

                rows="10"

                placeholder="Paste Job Description Here">

        </textarea>

    </div>

    <div style="text-align:center; margin-top:20px;">

        <button onclick="matchATS()">

            Check ATS Match

        </button>

    </div>

    <div class="result-container"
         id="atsResultContainer">

        <div class="score-wrapper">

            <div class="score-card">

                <h2>ATS Match Score</h2>

                <div class="score"
                     id="matchScore">

                    0

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Matched Skills</h2>

            <div class="skills"
                 id="matchedSkills">

            </div>

        </div>

        <div class="section">

            <h2>Missing Skills</h2>

            <div class="skills"
                 id="missingSkills">

            </div>

        </div>

        <div class="section">

            <h2>ATS Suggestions</h2>

            <div class="suggestion"
                 id="atsSuggestion">

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
