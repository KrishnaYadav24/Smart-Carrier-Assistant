<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{

            font-family:Arial;

            background:#111827;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;
        }

        .box{

            background:white;

            padding:40px;

            border-radius:15px;

            width:350px;
        }

        input{

            width:100%;

            padding:12px;

            margin-top:15px;
        }

        button{

            width:100%;

            padding:12px;

            margin-top:20px;

            background:#16a34a;

            color:white;

            border:none;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Login</h2>

    <input type="text"
           id="username"
           placeholder="Username">

    <input type="password"
           id="password"
           placeholder="Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

async function login(){

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    const response = await fetch(

        "/api/auth/login",

        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username,
                password:password
            })
        }
    );

    const data = await response.text();

    alert(data);

   if(data === "Login Successful"){

    localStorage.setItem(
        "username",
        username
    );

    window.location.href = "/";
    }
}

</script>

</body>
</html>
