<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Role Predictor</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Smart Career Assistant
    </div>

    <div class="nav-links">

        <a href="/">Resume Analyzer</a>

        <a href="/ats.html">ATS Match</a>

        <a href="/interview.html">Interview Prep</a>

        <a href="/job-role-predictor.html">
            Job Predictor
        </a>

    </div>

</nav>

<div class="container">

    <h1>AI Job Role Predictor</h1>

    <p class="subtitle">

        Upload your resume and discover
        the best career roles for you.

    </p>

    <div class="upload-box">

        <input type="file"
               id="jobResumeFile"
               accept=".pdf">

        <br><br>

        <button onclick="predictJobRole()">

            Predict Job Roles

        </button>

    </div>

    <div class="loading"
         id="jobLoading">

        Predicting Roles...

    </div>

    <div class="result-container"
         id="jobResultContainer">

        <div class="section">

            <h2>Recommended Job Roles</h2>

            <div class="skills"
                 id="predictedRoles">

            </div>

        </div>

        <div class="section">

            <h2>AI Career Explanation</h2>

            <div class="suggestion"
                 id="roleExplanation">

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
