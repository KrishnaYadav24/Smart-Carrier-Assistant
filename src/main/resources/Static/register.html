<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <style>

        body{

            font-family:Arial;

            background:#0f172a;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;
        }

        .box{

            background:white;

            padding:40px;

            border-radius:15px;

            width:350px;
        }

        input{

            width:100%;

            padding:12px;

            margin-top:15px;
        }

        button{

            width:100%;

            padding:12px;

            margin-top:20px;

            background:#2563eb;

            color:white;

            border:none;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Register</h2>

    <input type="text"
           id="username"
           placeholder="Username">

    <input type="password"
           id="password"
           placeholder="Password">

    <button onclick="register()">
        Register
    </button>

</div>

<script>

async function register(){

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    const response = await fetch(

        "/api/auth/register",

        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username,
                password:password,
                role:"USER"
            })
        }
    );

    const data = await response.text();

    alert(data);

    window.location.href = "/login.html";
}

</script>

</body>
</html>
